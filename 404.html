<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — pragma studio</title>
  <meta name="description" content="La página que buscás no existe o se movió. Volvé al inicio de pragma studio.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f2;
      --bg-2: #eeece5;
      --ink: #0a0a0a;
      --ink-2: #666;
      --bordo: #6b1c1c;
      --bordo-hover: #8a2626;
      --line: rgba(10, 10, 10, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      padding: 2rem 1.25rem;
      text-align: center;
    }

    .wrap { max-width: 520px; }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bordo);
      margin-bottom: 1.25rem;
    }

    .big {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(4.5rem, 20vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 2rem);
      margin: 1.25rem 0 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--ink-2);
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    a.btn-primary {
      background: var(--bordo);
      color: #fff;
    }

    a.btn-primary:hover { background: var(--bordo-hover); transform: translateY(-2px); }

    a.btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    a.btn-secondary:hover { border-color: var(--ink); transform: translateY(-2px); }

    .brand {
      margin-top: 3rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }

    .brand span { color: var(--bordo); }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="code">Error 404</div>
    <div class="big">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté roto o que la página se haya movido. Desde el inicio podés seguir explorando el estudio.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Volver al inicio</a>
      <a class="btn btn-secondary" href="/proyectos.html">Ver proyectos</a>
    </div>
    <div class="brand">pragma<span>studio</span></div>
  </main>
</body>

</html>
